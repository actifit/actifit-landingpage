<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1500" height="1000" viewBox="0 0 1500 1000">
  <defs>
    <!-- Legibility overlays layered over the photo (photo is supplied by the renderer as the page background) -->
    <linearGradient id="leftDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#140804" stop-opacity="0.72"/>
      <stop offset="45%" stop-color="#140804" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#140804" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0a0402" stop-opacity="0.55"/>
      <stop offset="28%"  stop-color="#0a0402" stop-opacity="0.10"/>
      <stop offset="62%"  stop-color="#0a0402" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a0402" stop-opacity="0.78"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#ffb53d"/>
    </linearGradient>

    <filter id="txtShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="ctaShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

