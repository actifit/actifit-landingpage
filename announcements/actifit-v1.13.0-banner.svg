  <!-- ===== overlays over the photo ===== -->
  <rect width="1500" height="1000" fill="url(#vDark)"/>
  <rect width="1500" height="1000" fill="url(#leftDark)"/>

  <!-- ===== HEADER ===== -->
  <use href="#actifit-runner" x="60" y="52" width="96" height="92"/>
  <text x="172" y="130" font-family="Poppins" font-weight="700" font-size="66" fill="#ffffff" letter-spacing="-1" filter="url(#txtShadow)">actifit</text>
  <g transform="translate(400, 74)" filter="url(#txtShadow)">
    <rect x="0" y="0" width="146" height="52" rx="26" fill="#ff7a00" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <text x="73" y="36" font-family="Poppins" font-weight="700" font-size="26" fill="#ffffff" text-anchor="middle">1.13.0</text>
  </g>

  <!-- ===== HEADLINE ===== -->
  <text x="80" y="300" font-family="Poppins" font-weight="700" font-size="94" fill="#ffffff" letter-spacing="-2" filter="url(#txtShadow)">Wallet &amp; Market</text>
  <text x="80" y="405" font-family="Poppins" font-weight="700" font-size="94" letter-spacing="-2" filter="url(#txtShadow)"><tspan fill="url(#accent)">Revamp</tspan><tspan fill="#ffffff"> &amp; Friends</tspan></text>

  <!-- ===== SUBHEAD ===== -->
  <text x="82" y="470" font-family="Poppins" font-weight="500" font-size="30" fill="#ffffff" letter-spacing="0.5" filter="url(#txtShadow)">Wallet &amp; Market  |  Friends  |  Cleaner Cards &amp; More!</text>

  <!-- ===== BADGES ===== -->
  <g filter="url(#txtShadow)">
  <!-- 1 Wallet -->
  <g transform="translate(180, 610)">
    <use href="#hex" fill="rgba(0,0,0,0.34)" stroke="rgba(255,255,255,0.5)" stroke-width="2.5"/>
    <g>
      <rect x="-22" y="-15" width="44" height="30" rx="6" fill="#ffc23d"/>
      <rect x="-22" y="-6" width="44" height="7" fill="#e19b1e"/>
      <circle cx="11" cy="6" r="4.5" fill="#7a4a00"/>
    </g>
    <text x="0" y="92" font-family="Poppins" font-weight="700" font-size="19" fill="#fff" text-anchor="middle">Wallet</text>
    <text x="0" y="116" font-family="Poppins" font-weight="700" font-size="19" fill="#fff" text-anchor="middle">Revamp</text>
  </g>
  <!-- 2 Market -->
  <g transform="translate(408, 610)">
    <use href="#hex" fill="rgba(0,0,0,0.34)" stroke="rgba(255,255,255,0.5)" stroke-width="2.5"/>
    <g>
      <path d="M-18 -6 h36 l-3.5 30 h-29 z" fill="#ff7a1f"/>
      <path d="M-9 -6 a9 9 0 0 1 18 0" fill="none" stroke="#ffffff" stroke-width="3.4"/>
    </g>
    <text x="0" y="92" font-family="Poppins" font-weight="700" font-size="19" fill="#fff" text-anchor="middle">Market</text>
    <text x="0" y="116" font-family="Poppins" font-weight="700" font-size="19" fill="#fff" text-anchor="middle">Screen</text>
  </g>
  <!-- 3 Friends -->
  <g transform="translate(636, 610)">
    <use href="#hex" fill="rgba(0,0,0,0.34)" stroke="rgba(255,255,255,0.5)" stroke-width="2.5"/>
    <g>
      <circle cx="10" cy="-9" r="7.5" fill="#6bb2ff"/>
      <path d="M-4 16 a15 15 0 0 1 28 0 z" fill="#6bb2ff"/>
      <circle cx="-11" cy="-7" r="8.5" fill="#3d8bff"/>
      <path d="M-27 17 a16 16 0 0 1 32 0 z" fill="#3d8bff"/>
    </g>
    <text x="0" y="92" font-family="Poppins" font-weight="700" font-size="19" fill="#fff" text-anchor="middle">Friends</text>
    <text x="0" y="116" font-family="Poppins" font-weight="700" font-size="19" fill="#fff" text-anchor="middle">System</text>
  </g>
  <!-- 4 Photo Cropping -->
  <g transform="translate(864, 610)">
    <use href="#hex" fill="rgba(0,0,0,0.34)" stroke="rgba(255,255,255,0.5)" stroke-width="2.5"/>
    <g>
      <rect x="-19" y="-16" width="38" height="32" rx="5" fill="#2fd6c3"/>
      <circle cx="-8" cy="-6" r="4.5" fill="#ffffff"/>
      <path d="M-19 12 L-3 -3 L7 7 L14 1 L19 6 L19 16 L-19 16 Z" fill="#ffffff"/>
      <path d="M12 -20 L12 -13 M12 -20 L19 -20 M-12 20 L-12 13 M-12 20 L-19 20" stroke="#0b7d72" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="0" y="92" font-family="Poppins" font-weight="700" font-size="19" fill="#fff" text-anchor="middle">Photo</text>
    <text x="0" y="116" font-family="Poppins" font-weight="700" font-size="19" fill="#fff" text-anchor="middle">Cropping</text>
  </g>
  <!-- 5 Cleaner Cards -->
  <g transform="translate(1092, 610)">
    <use href="#hex" fill="rgba(0,0,0,0.34)" stroke="rgba(255,255,255,0.5)" stroke-width="2.5"/>
    <g>
      <rect x="-18" y="-9" width="26" height="34" rx="4" fill="#7a4fe0"/>
      <rect x="-6" y="-18" width="26" height="34" rx="4" fill="#b98cff" stroke="#ffffff" stroke-width="1.6"/>
    </g>
    <text x="0" y="92" font-family="Poppins" font-weight="700" font-size="19" fill="#fff" text-anchor="middle">Cleaner</text>
    <text x="0" y="116" font-family="Poppins" font-weight="700" font-size="19" fill="#fff" text-anchor="middle">Cards</text>
  </g>
  <!-- 6 Security -->
  <g transform="translate(1320, 610)">
    <use href="#hex" fill="rgba(0,0,0,0.34)" stroke="rgba(255,255,255,0.5)" stroke-width="2.5"/>
    <g>
      <path d="M0 -21 L18 -14 L18 5 C18 17 10 23 0 26 C-10 23 -18 17 -18 5 L-18 -14 Z" fill="#ffc23d"/>
      <path d="M-8 0 L-1 8 L9 -8" stroke="#7a4a00" stroke-width="4.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="0" y="92" font-family="Poppins" font-weight="700" font-size="19" fill="#fff" text-anchor="middle">Security</text>
    <text x="0" y="116" font-family="Poppins" font-weight="700" font-size="19" fill="#fff" text-anchor="middle">&amp; Privacy</text>
  </g>
  </g>

  <!-- ===== TAGLINE ===== -->
  <text x="750" y="815" font-family="Poppins" font-weight="500" font-style="italic" font-size="30" fill="#ffffff" text-anchor="middle" filter="url(#txtShadow)">Our biggest web refresh in months — smoother, cleaner, more connected!</text>

  <!-- ===== CTA BUTTON ===== -->
  <g transform="translate(750, 890)" filter="url(#ctaShadow)">
    <rect x="-205" y="-38" width="410" height="76" rx="12" fill="#ff112d"/>
    <text x="0" y="9" font-family="Poppins" font-weight="700" font-size="31" fill="#ffffff" text-anchor="middle">Read The Full Update</text>
  </g>

  <!-- ===== HIVE LOGO bottom-right ===== -->
  <g transform="translate(1372, 906)" filter="url(#txtShadow)">
    <image href="data:image/png;base64," x="0" y="0" width="76" height="66" preserveAspectRatio="xMidYMid meet"/>
  </g>
