name: Lockfile sync

# Guards against the silent production-deploy failure where package-lock.json is
# out of sync with package.json: DigitalOcean builds via `npm ci`, which hard-fails
# with EUSAGE ("Missing: <pkg> from lock file") and the deploy never ships (live
# silently stays on the old build). This has happened twice (1.12.0, 1.12.2) when a
# release skipped the local pre-flight. This job reproduces the DO install so a
# desync shows a red X on the PR before merge, regardless of who cuts the release.
#
# NOTE: no `paths:` filter — this check is *required* in branch protection, and a
# required check that gets path-skipped stays "pending" forever and blocks every
# PR that doesn't touch package files (GitHub gotcha). Running on all PRs to
# develop/master guarantees it always reports a status. npm ci is ~2-3 min.

on:
  pull_request:
    branches: [develop, master]
  # Daily too: a new upstream release can break `npm ci` without any change here (ws
  # 5.2.8 did, 2026-11-12, failing the 1.14.42 deploy). GitHub runs schedules only from
  # the DEFAULT branch's copy of this file, and emails a failure to whoever last edited
  # the cron line; on a public repo it pauses schedules after 60 days without activity.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  npm-ci:
    name: npm ci (package-lock.json in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the daily run checks what deploys (master), whatever the default branch is
          ref: ${{ github.event_name == 'schedule' && 'master' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc' # v16.20.2, matching the DigitalOcean build
      - name: npm ci (mirrors the DigitalOcean production build)
        # Any package.json <-> package-lock.json desync fails here with EUSAGE,
        # exactly as the deploy would — catching it before it reaches master.
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
